<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Terminal window -->
  <rect x="72" y="100" width="368" height="312" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="3"/>
  <!-- Title bar -->
  <rect x="72" y="100" width="368" height="36" rx="16" fill="#161b22"/>
  <rect x="72" y="120" width="368" height="16" fill="#161b22"/>
  <!-- Traffic lights -->
  <circle cx="100" cy="118" r="7" fill="#ff5f57"/>
  <circle cx="122" cy="118" r="7" fill="#febc2e"/>
  <circle cx="144" cy="118" r="7" fill="#28c840"/>
  <!-- Prompt line 1: threads search -->
  <text x="96" y="176" font-family="monospace" font-size="20" fill="#8b949e">$</text>
  <text x="116" y="176" font-family="monospace" font-size="20" fill="#58a6ff">threads</text>
  <text x="210" y="176" font-family="monospace" font-size="20" fill="#c9d1d9">search</text>
  <!-- Prompt line 2: result -->
  <text x="96" y="212" font-family="monospace" font-size="18" fill="#3fb950">@</text>
  <text x="112" y="212" font-family="monospace" font-size="18" fill="#c9d1d9">thread found</text>
  <!-- Prompt line 3 -->
  <text x="96" y="248" font-family="monospace" font-size="18" fill="#3fb950">@</text>
  <text x="112" y="248" font-family="monospace" font-size="18" fill="#c9d1d9">thread saved</text>
  <!-- Cursor -->
  <rect x="96" y="272" width="12" height="22" fill="#58a6ff" opacity="0.8"/>
  <!-- Threads-inspired @ symbol watermark -->
  <text x="340" y="380" font-family="sans-serif" font-size="72" fill="#58a6ff" opacity="0.15" font-weight="bold">@</text>
</svg>
